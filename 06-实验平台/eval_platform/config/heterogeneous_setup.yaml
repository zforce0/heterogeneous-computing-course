  order: [mac-m1, ascend-box, rk3588, rv1126b]
  two_layer_verdict:
    layer1_raw_compute: "昇腾盒子第一：20 TOPS INT8 / 10 TFLOPS FP16 / 24 GB > M1（ANE 11 TOPS / ≈2.6 TFLOPS FP32 / 16 GB）> RK3588 6 TOPS / 7.73 GiB > RV1126B 2–3 TOPS / 1.9 GiB"
    layer2_practical_llm: "M1 仍是唯一且最强：68.25 GB/s > 盒子 ~51.2 GB/s(推断)；盒子无任何 LLM 运行时、无 pip、无外网，LLM 实测吞吐 N/A；M1 已部署 hetero-edge-llm:v1 实测 9.34 tok/s"
    decision: "不迁移中心 LLM；保持「M1 跑 LLM + 昇腾/RK/RV 跑端侧视觉」分工"
    invalidated_assumption: "11-13 的「8 TOPS INT8 / 4 GB / 25.6 GB/s」假设已被实测推翻，但结论未翻转，理由见 layer2"
  evidence:
    mac-m1: "16 GB 统一内存 + 68.25 GB/s + Metal/llama.cpp；本机 8.2B Q4 实测 9.30/9.34/9.53 tok/s（中位 9.34）；公版 7B Q4_0 约 14 tok/s"
    ascend-box: "实测 310B1 / 20 TOPS INT8 / 10 TFLOPS FP16 / 23,673 MB ≈ 24 GB；带宽 ~51.2 GB/s 为 96bit LPDDR4X 规格推断；CANN 8.0.RC3 但无 MindIE/torch_npu/transformers/llama.cpp/ollama，Python 无 pip、无外网 → 当前无法启动 LLM"
    rk3588: "7.73 GiB；RKLLM 7B W4A16 约 2.8–3.5 tok/s，0.5B 才流畅"
    rv1126b: "1.9 GiB，仅 ≤0.5B 模型"
  flip_condition: "原条件（300I Duo 310P/140 TOPS/48 GB 或 910B 级 ≥32 GB HBM + MindIE）判定：本机 310B1、无 HBM、无 MindIE → 不满足"
  new_flip_path: "需在盒子离线安装 MindIE 或 llama.cpp-CANN + ATC 转 INT8 模型 + 实测同模型 decode tok/s；若超过 M1 的 9.34 tok/s 再考虑迁移。盒子无外网，须由 Mac 下载 aarch64/CANN 8.0.RC3 匹配包后 scp"

