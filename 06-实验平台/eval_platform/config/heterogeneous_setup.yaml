# ═══ RV1126B 复测与地址固化（2026-11-16 16:15 实测）═════════════════════
g4_rv1126b_recovery_20261116_1615:
  verdict: "硬件完好、可正常使用——此前「离线」是地址问题，不是烧坏"
  device: "EASY-EAI-NANO-TB / Rockchip RV1126B NANO V10 / 4 核 aarch64 / 1968 MB / kernel 6.1.141"
  mac: "4e:0e:39:be:41:b3"
  root_cause: "板端 netplan：eth0(NET0)=dhcp4:true，静态 .22 原配在 eth1(NET1)。本轮网线插在 NET0，而实验网段无 DHCP 服务器 → 板子拿不到地址、二层零流量，故 ARP 与全网段扫描均不可见。旁证：camera-preview.service 因绑定 192.168.77.22 失败，累计重启 65840 次"
  diagnosis_method: "在 RK3588 上临时起 dnsmasq 当 DHCP 服务器，板子续租时的 DHCPDISCOVER 立即暴露主机名与 MAC（无 IP 的设备只有 DHCP 能召唤出来）"
  fix: "eth0 改为静态 192.168.77.22/24（dhcp4:false），eth1 去掉重复的静态地址；netplan 原文件备份为 *.bak.20261116；重启验证通过（重启后 uptime 0 min 即带静态地址，SSH 免密可用）"
  dhcp_fallback: "RK3588 systemd 服务 g4-dhcp.service（/etc/g4-dhcp.conf：仅 eth1、port=0 不做 DNS、RV MAC→.22 infinite、其它设备 .150-.170），已 enable --now；板子若被重刷回 DHCP 也能自动拿回原地址"
  ssh: "root 免密（ed25519 公钥已装；板厂默认密码见私有记录，不落盘）"
  services: "8082 camera_stream.py 在线：可见光 10 fps、YOLO 检出正常（mouse 0.784 / chair 0.783）；22 SSH 免密"
  thermal_ir: "NOT READY — 厂商 SDK /root/eval_dashboard/ir_snap 报 'IR camera 0bda:5840 was not found'，lsusb 无 0bda:5840；属物理连接问题，需检查热成像模组 USB 线"
  measured: "ping .22 RTT 1.28 ms；重启前后均在线；四节点 dashboard api/status 全 up"
  open_item: "热成像模组重新插好 USB 后，重跑 ./ir_snap 与 /status.json 复验 ir_ready"

