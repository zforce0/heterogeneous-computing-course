.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #e5e5e5;margin-bottom:18px}
.tab{border:0;background:none;padding:9px 14px;font:inherit;color:#666;cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:#185FA5}
.tab.on{color:#185FA5;border-bottom-color:#185FA5;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:12px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;flex:1 1 280px;min-width:260px}
.card.wide{flex-basis:100%}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:500;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:#777}
.kpi .s{font-size:11px;color:#999}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
th{color:#666;font-weight:500;background:#fafafa}
td.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{height:9px;border-radius:5px;background:#E6F1FB;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:#378ADD;border-radius:5px}
.bar.teal>i{background:#1D9E75}
.bar.amber>i{background:#EF9F27}
.bar.red>i{background:#E24B4A}
.na{color:#888;font-style:italic}
.camrow{display:flex;gap:12px;flex-wrap:nowrap;width:100%}
.camrow>.card{flex:1 1 0;min-width:0}
.camwin{width:100%;height:480px;margin:0 auto;border:1px solid #e5e5e5;border-radius:8px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;overflow:auto}
.camwin img{display:block;width:auto;height:auto;max-width:none;object-fit:none}
.camcap{text-align:center;color:#777;font-size:12px;margin-top:6px}
.barline{display:grid;grid-template-columns:190px 1fr 96px;gap:10px;align-items:center;margin:7px 0;font-size:12px}
.barline .lab{color:#444}
.barline .val{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;color:#333}
.timeline{display:flex;flex-wrap:wrap;gap:8px}
.tnode{border:1px solid #e5e5e5;border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;min-width:150px}
.tnode.done{border-color:#9FE1CB;background:#E1F5EE}
.tnode.active{border-color:#FAC775;background:#FAEEDA}
.tnode.todo{color:#888}
.tnode b{font-weight:500}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stage{border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;min-width:130px;font-size:12px;background:#fff}
.stage.done{background:#E1F5EE;border-color:#9FE1CB}
.stage.active{background:#FAEEDA;border-color:#FAC775}
.stage.todo{color:#999}
.expgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
.exp{border:1px solid #e5e5e5;border-radius:6px;padding:6px 8px;font-size:11px;background:#fff}
.exp.done{background:#E1F5EE;border-color:#9FE1CB}
.exp.active{background:#FAEEDA;border-color:#FAC775}
.exp.todo{color:#aaa}
ul.warn li{margin:5px 0;color:#713B12}
ul.plain{margin:0;padding-left:18px}
select,button{font:inherit;font-size:12px;padding:6px 10px;border:1px solid #d7d7d7;border-radius:6px;background:#fff;color:#333;cursor:pointer}
button:hover{border-color:#185FA5;color:#185FA5}
.hint{background:#f6f8fa;border-left:3px solid #2f6feb;padding:10px 14px;margin:12px 0;font-size:12px;color:#444}
.hide{display:none!important}
.dim{opacity:.42}
.exp.partial{background:#FAEEDA;border-color:#FAC775}
.exp.na{color:#999;background:#F1EFE8;border-color:#D3D1C7}
footer{margin-top:24px;color:#999;font-size:11px;border-top:1px solid #eee;padding-top:12px}
@media(max-width:700px){.barline{grid-template-columns:120px 1fr 72px}.wrap{padding:14px}}

function card(title,body,wide){ return "<div class='card"+(wide?" wide":"")+"'><h2>"+esc(title)+"</h2>"+body+"</div>"; }
function table(headers,rows){
  var h="<table><thead><tr>"+headers.map(function(x){return "<th>"+esc(x)+"</th>";}).join("")+"</tr></thead><tbody>";
  rows.forEach(function(r){ h+="<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>"; });
  return h+"</tbody></table>";
}
function barline(label,value,max,unit,cls){
  var na=isNA(value), pct = na?0:Math.max(2,Math.min(100, Number(value)/max*100));
  return "<div class='barline'><div class='lab' title='"+esc(label)+"'>"+esc(label)+"</div>"+
    "<div class='bar "+(cls||"")+"'><i style='width:"+pct+"%'></i></div>"+
    "<div class='val'>"+(na?"<span class='na'>N/A</span>":esc(value)+" "+esc(unit||""))+"</div></div>";
}
function warnList(items){ return "<ul class='warn plain'>"+items.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>"; }

function setCamImg(id,path){
  var e=document.getElementById(id); if(!e) return;
  if(CAM_ACTIVE===""){ e.src=path; return; }
  fetch(CAM_ACTIVE+path,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.blob();
  }).then(function(b){
    if(BLOB_URLS[id]) URL.revokeObjectURL(BLOB_URLS[id]);

    e.src=BLOB_URLS[id];
  }).catch(function(){});

function drawOverlay(dets){
  var c=document.getElementById("camVisOv");
  if(!c||!c.getContext) return;
  var x=c.getContext("2d");
  if(!x) return;
  x.clearRect(0,0,640,480);
  var n=0;
  (dets||[]).forEach(function(d){
    var b=d.box;
    if(!b||b.length<4) return;
    n++;
    var x1=b[0], y1=b[1], x2=b[2], y2=b[3];
    x.strokeStyle="#E24B4A"; x.lineWidth=2;
    x.strokeRect(x1,y1,x2-x1,y2-y1);
    var label=(d.name||"obj")+" "+(Number(d.score)||0).toFixed(2);
    x.font="12px sans-serif";
    var w=x.measureText(label).width+8;
    var ty=Math.max(0,y1-18);
    x.fillStyle="rgba(226,75,74,0.92)";
    x.fillRect(x1,ty,w,18);
    x.fillStyle="#ffffff";
    x.fillText(label,x1+4,ty+13);
  });
  var el=document.getElementById("camDet");
  if(el) el.textContent="实时检测 "+n+" 个目标 · infer "+esc(window.__lastInfer||"N/A")+" ms";
}

  h+="<div class='card wide'><h2>"+esc(bb.title)+"</h2><p>"+esc(bb.summary)+"</p><p class='meta'>"+esc(bb.note)+"</p></div>";
  h+=card("基线（RV NPU）",table(["节点","单元","模型","时延","帧率","利用率"],[
    [b.node,b.unit,b.model,b.latency_ms+" ms",b.fps,b.util]
  ])+"<div class='hint'>"+esc(b.note)+"</div>",true);
  h+=card("RK3588 三种算力单元",table(["策略","单元","负载","结果","利用率","性质"],bb.backends.map(function(x){
    return [x.id,x.unit,x.workload,x.result,x.util,x.kind];
  })),true);
  h+=card("结论",warnList(bb.conclusion||[]),true);
  h+="</div>";
  return h;
}
function renderPanel(){
  var f={overview:overview,latency:latency,throughput:throughput,queue:queue,resources:resources,progress:progress,cautions:cautions,cameras:cameraView,detection:detectionView,interconnect:interconnectView,perf:perfView,backend:backendView}[cur];
  document.getElementById("panel").innerHTML=f();
  applyFilter();
  if(cur==="cameras"){ startCameras(); } else { clearInterval(window.__camTimer); }
}
function applyFilter(){
  var n=document.getElementById("nodeSel").value;
  Array.prototype.forEach.call(document.querySelectorAll("[data-node]"),function(el){
    el.classList.toggle("dim", n!=="all" && el.getAttribute("data-node")!==n && el.getAttribute("data-node")!=="all");
  });
  var names={all:"全平台",mac:"Mac",rk3588:"RK3588",rv1126b:"RV1126B"};
  document.getElementById("nodeView").textContent="节点视图："+names[n];
}
function renderRunSelect(){
  var s=document.getElementById("runSel");
  s.innerHTML="<option value=''>最近结果包…</option>"+DATA.runs.map(function(r){
    return "<option value='"+esc(r.id)+"'>"+esc(r.experiment||"—")+" · "+esc(r.status)+" · "+esc(r.id.slice(0,15))+"</option>";
  }).join("");
  s.onchange=function(){
    var r=DATA.runs.filter(function(x){return x.id===s.value;})[0], box=document.getElementById("runDetail");
    if(!r){box.innerHTML="";return;}
    var rows=Object.keys(r.findings||{}).map(function(k){return [esc(k),esc(String(r.findings[k]).slice(0,260))];});
    box.innerHTML="<div style='margin-top:18px'>"+card("结果包 "+esc(r.id)+" · "+esc(r.status),table(["项","结论"],rows),true)+"</div>";
  };
}
function boot(){
  document.title=DATA.meta.title;
  document.getElementById("title").textContent=DATA.meta.title;
  renderTop(); renderTabs(); renderPanel(); renderRunSelect();
  var q=new URLSearchParams(location.search).get("node")||LOCAL_NODE;
  if(q && ["mac","rk3588","rv1126b"].indexOf(q)>=0){ document.getElementById("nodeSel").value=q; }
  applyFilter();
  document.getElementById("footer").textContent="零外部依赖 · 单文件可离线查看 · 数据源 "+DATA.meta.source;
  document.getElementById("nodeSel").onchange=applyFilter;
  document.getElementById("refresh").onclick=function(){
    fetch("data.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      DATA=j; renderTop(); renderPanel(); renderRunSelect();
      document.getElementById("subtitle").textContent+=" · 已刷新";
    }).catch(function(){
      document.getElementById("subtitle").textContent+=" · 离线快照（data.json 不可达）";
    });
  };
}
boot();
</script>
</body>
</html>
