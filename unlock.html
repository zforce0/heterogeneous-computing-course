<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程核心材料 · 解锁访问</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;
        --blue:#58a6ff;--green:#3fb950;--red:#f85149;--accent:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px}
  .gate{text-align:center;padding:44px 24px}
  .gate .lock{font-size:44px;margin-bottom:10px}
  input[type=password]{width:min(360px,100%);padding:11px 14px;background:#0d1117;border:1px solid var(--line);
    border-radius:7px;color:var(--text);font-size:15px;outline:none}
  input[type=password]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(88,166,255,.15)}
  button{background:var(--blue);color:#06101c;border:0;border-radius:7px;padding:11px 22px;
    font-size:14px;font-weight:600;cursor:pointer;margin-left:8px}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  .msg{margin-top:14px;min-height:22px;color:var(--muted)}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .tree{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .dir{padding:8px 14px;background:#1c2128;font-weight:600;color:var(--accent);border-bottom:1px solid var(--line)}
  .file{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #21262d}
  .file:last-child{border-bottom:0}
  .file .n{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--text);word-break:break-all}
  .file .s{color:var(--muted);font-size:12px;margin-left:12px;white-space:nowrap}
  .file button{padding:3px 10px;font-size:12px;margin:0}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .hint{font-size:12.5px;color:var(--muted)}
  code{background:#0d1117;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>《多核异构互联计算》课程产品包 · 核心材料解锁</h1>
  <div class="sub">输入授权密码后，在浏览器本地解密 <code>protected/course-core.tar.enc</code>，解锁全部 PPT / 手册 / 测评 / 教案。</div>

  <!-- 解锁门 -->
  <div class="card gate" id="gate">
    <div class="lock">🔒</div>
    <div style="margin-bottom:14px">密码由课程授权方线下提供，不随课程包分发。</div>
    <input type="password" id="pwd" placeholder="输入授权密码" autocomplete="off">
    <button id="go">解锁</button>
    <div class="msg" id="msg"></div>
    <div class="hint" style="margin-top:18px">
      也可使用命令行：<code>KIT_PASSWORD='&lt;密码&gt;' python3 scripts/protect_core.py decrypt</code>
    </div>
  </div>

  <!-- 解锁后 -->
  <div id="vault" class="hidden">
    <div class="card">
      <div class="bar">
        <div><span id="stat" class="msg ok" style="margin:0"></span></div>
        <div>
          <button class="ghost" id="dlall">下载原始加密包</button>
          <button class="ghost" id="lock">重新上锁</button>
        </div>
      </div>
      <div class="hint">点「打开」在浏览器查看文本文件；PPT / DOCX 等二进制请下载后用对应软件打开。</div>
    </div>
    <div class="card"><div class="tree" id="tree"></div></div>
  </div>
</div>

<script>
/* ── 解密核心：复现 openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt ── */
const ENC_URL = 'protected/course-core.tar.enc';
// Pages 对单个大文件下载极慢（实测 1.8MB 30s 未完成），拆成 200KB 分片并行拉取
const PARTS = ['aa','ab','ac','ad','ae','af','ag','ah','ai'];
const PART_URLS = PARTS.map(p => 'protected/parts/core.part.' + p);
const enc = new TextEncoder();
const $ = id => document.getElementById(id);
let files = [];   // {name, bytes:Uint8Array}

function msg(t, cls=''){ const m=$('msg'); m.textContent=t; m.className='msg '+cls; }

async function derive(password, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  // openssl 把 key(32B)+iv(16B) 一起从 PBKDF2 派生
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, 48*8));
  return {key:bits.slice(0,32), iv:bits.slice(32,48)};
}

async function unlock(password){
  msg('正在读取加密包…');
  let buf;
  try{
    // 优先并行拉取分片（Pages 大文件限流，小片快）
    const chunks = await Promise.all(PART_URLS.map(async u => {
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) throw new Error('分片 '+u+' HTTP '+r.status);
      return new Uint8Array(await r.arrayBuffer());
    }));
    const total = chunks.reduce((s,c)=>s+c.length,0);
    buf = new Uint8Array(total);
    let off=0; for(const c of chunks){ buf.set(c,off); off+=c.length; }
  }catch(e){
    // 回退：单片（本地 http.server 或网络环境良好时可用）
    try{
      const r = await fetch(ENC_URL, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      buf = new Uint8Array(await r.arrayBuffer());
    }catch(e2){
      throw new Error('无法读取加密包（分片与单片均失败）。请运行 python3 -m http.server 8000 后本地访问，或用脚本解密。');
    }
  }
  if(new TextDecoder('latin1').decode(buf.slice(0,8)) !== 'Salted__')
    throw new Error('加密包格式不正确（缺少 Salted__ 头）');
  const salt = buf.slice(8,16), data = buf.slice(16);
  msg('正在派生密钥（PBKDF2 200000 轮）…');
  const {key,iv} = await derive(password, salt);
  let plain;
  try{
    const ck = await crypto.subtle.importKey('raw', key, {name:'AES-CBC',length:256}, false, ['decrypt']);
    plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv}, ck, data));
  }catch(e){ throw new Error('密码错误，或加密包已损坏'); }
  msg('正在解析文件树…');
  files = parseTar(plain);
  if(!files.length) throw new Error('解密成功但未解析到文件');
  render();
}

/* ── 极简 tar 解析（ustar/GNU 基本头即可） ── */
function parseTar(u8){
  const out=[]; const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let off=0;
  const dec=(a,n)=>new TextDecoder().decode(u8.slice(a,a+n)).replace(/\0.*$/,'');
  while(off+512<=u8.length){
    const name=dec(off,100), sizeStr=dec(off+124,12).trim();
    if(!name) break;
    const size=parseInt(sizeStr,8)||0;
    const type=String.fromCharCode(u8[off+156]||48);
    if(type==='0'||type==='\0'){
      const prefix=dec(off+345,155);
      const full=(prefix?prefix+'/':'')+name;
      const start=off+512;
      out.push({name:full, bytes:u8.slice(start,start+size)});
    }
    off += 512 + Math.ceil(size/512)*512;
  }
  return out;
}

function fmtSize(n){ return n<1024?n+' B' : n<1048576?(n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB'; }

function render(){
  $('gate').classList.add('hidden');
  $('vault').classList.remove('hidden');
  $('stat').textContent = '✓ 解锁成功 · 共 '+files.length+' 个文件 · '+fmtSize(files.reduce((s,f)=>s+f.bytes.length,0));
  const groups={};
  for(const f of files){
    const d=f.name.split('/')[0]||'(root)';
    (groups[d]=groups[d]||[]).push(f);
  }
  const tree=$('tree'); tree.innerHTML='';
  for(const [dir,fs] of Object.entries(groups)){
    const h=document.createElement('div'); h.className='dir'; h.textContent='📁 '+dir+'  ('+fs.length+')';
    tree.appendChild(h);
    for(const f of fs){
      const row=document.createElement('div'); row.className='file';
      const nm=document.createElement('div');
      nm.innerHTML='<span class="n">'+escapeHtml(f.name)+'</span><span class="s">'+fmtSize(f.bytes.length)+'</span>';
      const op=document.createElement('button');
      op.className='ghost'; op.textContent='打开';
      op.onclick=()=>openFile(f);
      row.appendChild(nm); row.appendChild(op); tree.appendChild(row);
    }
  }
}

function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openFile(f){
  const blob=new Blob([f.bytes],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const ext=f.name.split('.').pop().toLowerCase();
  if(['md','txt','json','yaml','yml','html','csv','py','sh','cpp','h','c'].includes(ext)){
    const w=window.open('','_blank');
    if(w){
      w.document.write('<pre style="white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace;padding:20px">'+
        escapeHtml(new TextDecoder().decode(f.bytes))+'</pre>');
      w.document.close();
    }
  }else{
    const a=document.createElement('a'); a.href=url; a.download=f.name.split('/').pop(); a.click();
  }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

$('go').onclick=async()=>{
  const p=$('pwd').value;
  if(!p){ msg('请输入密码','err'); return; }
  $('go').disabled=true;
  try{ await unlock(p); msg(''); }
  catch(e){ msg(e.message,'err'); }
  finally{ $('go').disabled=false; }
};
$('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); });
$('lock').onclick=()=>{ files=[]; $('vault').classList.add('hidden'); $('gate').classList.remove('hidden'); $('pwd').value=''; msg('已重新上锁'); };
$('dlall').onclick=async()=>{
  try{
    const r=await fetch(ENC_URL); const b=await r.arrayBuffer();
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([b]));
    a.download='course-core.tar.enc'; a.click();
  }catch(e){ msg(e.message,'err'); }
};
</script>
</body>
</html>
